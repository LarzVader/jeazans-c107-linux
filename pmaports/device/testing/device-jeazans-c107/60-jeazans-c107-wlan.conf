# AIC8800D80 (wlan0): Ohne MAC im eFuse meldet die Firmware bei jedem Start eine
# andere Zufalls-MAC (Praefix 00:25:92:31), der Router vergibt dann jedes Mal
# eine neue IPv4-Adresse. Seit linux-jeazans-c107 r13 (Patch 0011) kann der
# Treiber die MAC setzen; "stable" gibt jeder Verbindung eine feste, aus der
# Maschinen-ID abgeleitete MAC. Zufalls-MACs beim Scannen bleiben aus: dafuer
# schaltet NetworkManager die Schnittstelle oft aus und ein, dabei stuerzte der
# Treiber frueher ab (behoben in r5, Patch 0008). Benannte Abschnitte mit
# match-device gehen den allgemeinen [device]/[connection] vor.
[device-jeazans-c107-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-jeazans-c107-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=stable
