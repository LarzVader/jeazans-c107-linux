# Tonprofil des Jeazans C107, nach dem Android-Mixerplan (vendor/etc/audio_mixer_paths.xml).
# Der Treiber laesst alle Ausgaenge eingeschaltet, darum hier erst alles aus.
SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='SPK Switch' off"
		cset "name='LINEOUTL Switch' off"
		cset "name='LINEOUTR Switch' off"
		cset "name='HPOUT Switch' off"
		cset "name='MIC1 Switch' off"
		cset "name='MIC2 Switch' off"
		cset "name='MIC3 Switch' off"

		cset "name='DAC Volume' 63"
	]
}

SectionDevice."Speaker" {
	Comment "Lautsprecher"

	ConflictingDevice [
		"Headphones"
	]

	# Kein PlaybackMixerElem: PulseAudio regelt hier in Software. Die Dezibel-Angaben
	# des Treibers taugen nicht: "DAC" endet bei -1,16 dB (PulseAudio regelt dann in
	# rohen Stufen, 50 % waeren -36 dB), bei "LINEOUT Gain" fuehrt jeder Wert unter
	# 0 dB auf 0, also stumm.
	EnableSequence [
		# Hoechstens so laut wie unter Android: dort DAC 56 und DACL/R 162, also
		# rund 6,6 dB unter dem Standard des Treibers (DAC 63, DACL/R 160)
		cset "name='DACL Volume' 151"
		cset "name='DACR Volume' 151"
		cset "name='LINEOUT Gain' 31"
		cset "name='LINEOUTL Switch' on"
		cset "name='LINEOUTR Switch' on"
		cset "name='SPK Switch' on"
	]

	DisableSequence [
		cset "name='SPK Switch' off"
		cset "name='LINEOUTL Switch' off"
		cset "name='LINEOUTR Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Kopfhoerer"

	ConflictingDevice [
		"Speaker"
	]

	# Auch hier regelt PulseAudio in Software, "HPOUT Gain" hat nur 8 Stufen
	EnableSequence [
		# Bewusst das technische Maximum, rund 6 dB ueber dem Android-Wert: Der
		# Nutzer hoert schlecht und moechte Reserve nach oben.
		cset "name='DACL Volume' 160"
		cset "name='DACR Volume' 160"
		cset "name='HPOUT Gain' 7"
		cset "name='HPOUT Switch' on"
	]

	DisableSequence [
		cset "name='HPOUT Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Eingebautes Mikrofon"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='MIC1 Switch' on"
	]

	DisableSequence [
		cset "name='MIC1 Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixerElem "ADC1 Gain"
	}
}

SectionDevice."Headset" {
	Comment "Mikrofon am Kopfhoerer"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='MIC3 Switch' on"
	]

	DisableSequence [
		cset "name='MIC3 Switch' off"
	]

	# Der Treiber meldet nur eine Buchse fuer Kopfhoerer mit und ohne Mikrofon. Darum
	# keine JackControl und niedrigere Prioritaet: Sonst wuerde jeder Kopfhoerer das
	# eingebaute Mikrofon abloesen, auch einer ohne Mikrofon.
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixerElem "ADC3 Gain"
	}
}
