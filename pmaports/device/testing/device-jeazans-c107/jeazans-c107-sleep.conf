# Ruhezustand ist auf diesem Kernel noch nicht erprobt, und das Tablet soll als Server wach
# bleiben. Ohne Erlaubnis meldet logind CanSuspend=na, dann versucht auch PowerDevil im
# Akkubetrieb keinen Ruhezustand. Bei fast leerem Akku schaltet UPower stattdessen aus.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
