# Jeazans C107: Neustart und Haenger ueber den Hardware-Watchdog (sunxi-wdt, max. 16 s).
# Der PSCI-Reset (SYSTEM_RESET und SYSTEM_RESET2) der Hersteller-Firmware kehrt nie zurueck,
# der Kernel kommt danach nicht mehr zum Watchdog-Reset. Gemessen am 29.10.2026: mit scharfem
# Watchdog kam die U-Boot-Begruessung 18,7 s nach "sysrq: Resetting".
# RebootWatchdogSec: Watchdog vor dem Neustart scharf schalten (Standard 10 min ist zu lang
# fuer sunxi-wdt, systemd laesst ihn dann aus).
# RuntimeWatchdogSec: haengt das System oder gibt es einen Kernel-Panic, setzt der Watchdog
# nach 15 s zurueck.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=15s
